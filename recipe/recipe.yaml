context:
  name: gxrio
  version: "1.1.0"

package:
  name: libgxrio
  version: ${{ version }}

source:
  url: https://forge.hekkelman.net/maarten/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: c762251ca8894fc6f778d63efeda5a3137925d804c850c74c2ab094b5210a502

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - ${{ "jom" if win else "make" }}
    - cmake
  host:
    - libboost-devel
    - liblzma
    - zlib
  ignore_run_exports:
    from_package:
      - libboost-devel

tests:
  - package_contents:
      include:
        - gxrio.hpp

about:
  homepage: https://forge.hekkelman.net/maarten/gxrio
  repository: https://forge.hekkelman.net/maarten/gxrio
  documentation: https://forge.hekkelman.net/maarten/gxrio/src/tag/v${{ version }}/README.md
  license: BSL-1.0
  license_file: LICENSE_1_0.txt
  summary: "A header only library to read and write compressed files using a standard streams interface"

extra:
  recipe-maintainers:
    - eunos-1128
