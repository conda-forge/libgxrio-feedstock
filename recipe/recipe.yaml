context:
  name: gxrio
  version: "1.3.1"

package:
  name: libgxrio
  version: ${{ version }}

source:
  url: https://forge.hekkelman.net/maarten/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: df9ef96ec94a797a2e98a7fa5264d3416ec0e4c8c21b77b00366a0b521637e2e

build:
  number: 0

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - ${{ "m2-sed" if win }}
    - ${{ "jom" if win else "make" }}
    - cmake
  host:
    - catch2
    - liblzma-devel
    - zlib
  ignore_run_exports:
    from_package:
      - catch2

tests:
  - package_contents:
      include:
        - gxrio.hpp

about:
  homepage: https://forge.hekkelman.net/maarten/gxrio
  repository: https://forge.hekkelman.net/maarten/gxrio
  documentation: https://forge.hekkelman.net/maarten/gxrio/src/tag/v${{ version }}/README.md
  license: BSL-1.0
  license_file: LICENSES/BSL-1.0.txt
  summary: "A header only library to read and write compressed files using a standard streams interface"

extra:
  recipe-maintainers:
    - eunos-1128
